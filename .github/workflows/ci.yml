name: CI

on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'fix/**'
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: "true"
  NODE_ENV: test
  APP_ENV: test
  PORT: 3000
  WORKER_PORT: 3001
  PUBLIC_APP_URL: http://localhost:3000
  LOG_LEVEL: info
  MONGODB_URI: mongodb://localhost:27017/ptc_ci_test
  SESSION_SECRET: ci_test_session_secret_minimum_32_characters_long_ptc
  SESSION_COOKIE_NAME: ptc_session
  SESSION_COOKIE_SECURE: "false"
  FIREBASE_PROJECT_ID: ptc-ci-test
  FIREBASE_CLIENT_EMAIL: ci-tester@ptc-ci-test.iam.gserviceaccount.com
  FIREBASE_PRIVATE_KEY: "-----BEGIN PRIVATE KEY-----\nMIIEvgIBADANBgkqhkiG9w0BAQEFAASCBKgwggSkAgEAAoIBAQC7ci_test_key\n-----END PRIVATE KEY-----"
  NEXT_PUBLIC_APP_URL: http://localhost:3000
  NEXT_PUBLIC_FIREBASE_API_KEY: ci_test_api_key
  NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ptc-ci-test.firebaseapp.com
  NEXT_PUBLIC_FIREBASE_PROJECT_ID: ptc-ci-test
  NEXT_PUBLIC_DEFAULT_LOCALE: en

jobs:
  quality:
    name: Code Quality & Type Safety
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.9.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm lint

      - name: Run TypeScript typecheck
        run: pnpm typecheck

  test:
    name: Unit & Regression Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.9.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Execute Vitest unit test suite
        run: pnpm test:unit

  build:
    name: Production Builds (Web & Worker)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.9.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Compile worker and build Next.js web application
        run: pnpm build

  security:
    name: Security & Secret Audits
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.9.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Run Gitleaks secret scan across git history
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify repository contains no sensitive files
        run: |
          echo "Scanning tracked files for sensitive patterns..."
          if git ls-files | grep -E '(\.env(\.local|\.production|\.staging)?$|\.pem$|\.key$|id_rsa)'; then
            echo "::error::Tracked sensitive file detected!"
            exit 1
          fi
          echo "No tracked sensitive files found."

      - name: Audit .env.example template safety
        run: |
          node -e "
            const fs = require('fs');
            const content = fs.readFileSync('.env.example', 'utf-8');
            const prohibited = ['AIzaSy', 'cluster0.mongodb.net', 'AKIA', 'ghp_'];
            for (const item of prohibited) {
              if (content.includes(item)) {
                console.error('::error::Prohibited real secret credential pattern found in .env.example: ' + item);
                process.exit(1);
              }
            }
            console.log('.env.example contains only sanitized template placeholders.');
          "

      - name: Audit dependency vulnerabilities
        run: pnpm audit --audit-level=high

      - name: Verify lockfile integrity
        run: |
          git diff --exit-code pnpm-lock.yaml || (echo "::error::pnpm-lock.yaml has uncommitted changes!" && exit 1)
